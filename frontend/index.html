<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dobium is a prediction market exchange. Trade the probability of real-world outcomes — the way quant firms already do." />

    <!-- Share preview. Without these a referral link pastes as a bare URL with
         no title, image or blurb, which is most of why shared links get
         ignored. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dobium" />
    <meta property="og:title" content="Dobium — a prediction market exchange" />
    <meta property="og:description" content="Trade the probability of real-world outcomes. Join the waitlist for early access." />
    <meta property="og:url" content="https://dobium.com" />
    <meta property="og:image" content="https://dobium.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dobium — a prediction market exchange" />
    <meta name="twitter:description" content="Trade the probability of real-world outcomes. Join the waitlist for early access." />
    <meta name="twitter:image" content="https://dobium.com/og.png" />
    <title>Dobium — Prediction Market for Trading the Moment</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Design system in index.css — no external CSS framework needed -->
  </head>
  <body class="min-h-screen" style="background: #0A1128;">
    <div id="root"></div>
    <!-- Runtime config injected by Express — keys come from root .env -->
    <script src="/config/supabase.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
